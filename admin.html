/* =====================================================================

     (ชื่อไฟล์แก้ได้ที่ url(...) ด้านล่าง)

@font-face{font-family:"DB HelvethaicaX";font-weight:600 700;font-style:normal;font-display:swap;

      url("fonts/DBHelvethaicaX-Bold.woff2") format("woff2"),url("fonts/DBHelvethaicaX-Bold.ttf") format("truetype")}
/* =====================================================================
   ปรับขนาดที่นี่ — แก้ตัวเลขใน :root ด้านล่างได้เลย (หน่วย px / rem)

:root{
  --font:"DB HelvethaicaX","DB Helvethaica X","DB Helvethaica","IBM Plex Sans Thai",system-ui,sans-serif; /* ฟอนต์หลักของทั้งหน้า */

}

<script>
/* ============ ตั้งค่า Firebase (Realtime Database) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBiiV4i3gExoT-SbB6uGMeQGmslj34Y_mY",
  authDomain: "selfcheckin69.firebaseapp.com",
  databaseURL: "https://selfcheckin69-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "selfcheckin69",
  storageBucket: "selfcheckin69.firebasestorage.app",
  messagingSenderId: "148350658850",
  appId: "1:148350658850:web:f9c9d459ea037c7fec9d7b"
};
const EVENT_NAME = "LOGISTICS GROWTH 2027";
const VENUE = "หอประชุมมหิศร ธนาคารไทยพาณิชย์ สำนักงานใหญ่";
/* โครงสร้าง: /guests/{id} = {seq,name,phone,email,company,group,checkedIn,checkedInAt,walkIn} */

/* ============ Data layer ============ */
const FIELDS = [["seq","ลำดับ"],["name","ชื่อ-นามสกุล"],["phone","เบอร์โทรศัพท์"],["email","E-mail"],["company","ชื่อบริษัท"],["group","กลุ่มธุรกิจ"]];
let guests = [], listeners = [], DB;
const useFB = !!(firebaseConfig.apiKey && firebaseConfig.databaseURL);
/* ข้อมูลแยก 2 ส่วน: /guests = สาธารณะ (ชื่อ บริษัท สถานะเช็คอิน) | /private = เฉพาะเจ้าหน้าที่ (เบอร์โทร อีเมล กลุ่มธุรกิจ) */
const PRIVK = ["phone","email","group"];
const splitPaths = (id, o, m) => { for (const k in o) m[(PRIVK.includes(k) ? "private/" : "guests/") + id + "/" + k] = o[k] === undefined ? null : o[k]; return m; };
if (useFB) {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database(), root = db.ref();
  let pubM = {}, prvM = {};
  const merge = cb => cb(Object.keys(pubM).map(id => ({...pubM[id], ...(prvM[id]||{}), id})));
  const errH = e => { console.error(e); toast("เชื่อมต่อฐานข้อมูลไม่ได้ (ตรวจสอบ databaseURL และ rules)"); };
  DB = {
    sub(cb){
      db.ref("guests").on("value", s => { pubM = s.val() || {}; merge(cb); }, errH);
      db.ref("private").on("value", s => { prvM = s.val() || {}; merge(cb); }, errH);
    },
    update(id, o){ return root.update(splitPaths(id, o, {})); },
    add(o){ const k = db.ref("guests").push().key; return root.update(splitPaths(k, o, {})).then(() => k); },
    bulk(list){ const m = {}; list.forEach(g => splitPaths(db.ref("guests").push().key, g, m)); return root.update(m); },
    reset(kind){
      if (kind === "all") return root.update({guests:null, "private":null});
      const m = {};
      guests.forEach(g => { if (kind === "walkin") { if (g.walkIn) { m["guests/"+g.id] = null; m["private/"+g.id] = null; } }
        else { m["guests/"+g.id+"/checkedIn"] = false; m["guests/"+g.id+"/checkedInAt"] = null; } });
      return Object.keys(m).length ? root.update(m) : null;
    },
    /* ข้อมูลเก่าที่เบอร์/อีเมล/กลุ่ม ยังอยู่ในส่วนสาธารณะ */
    legacy(){ return Object.keys(pubM).filter(id => PRIVK.some(k => pubM[id][k] !== undefined)).length; },
    migrate(){ const m = {}; Object.keys(pubM).forEach(id => PRIVK.forEach(k => { if (pubM[id][k] !== undefined) { m["private/"+id+"/"+k] = pubM[id][k]; m["guests/"+id+"/"+k] = null; } })); return root.update(m); }
  };
} else {
  document.getElementById("demo").hidden = false;
  const KEY = "checkin_guests_demo";
  let store = JSON.parse(localStorage.getItem(KEY) || "null") || {
    a1:{seq:"1",name:"สมชาย ใจดี",phone:"0812345678",email:"somchai@thaitech.co.th",company:"บริษัท ไทยเทค จำกัด",group:"ขนส่งสินค้า"},
    a2:{seq:"2",name:"สมหญิง รักเรียน",phone:"0898765432",email:"somying@thaitech.co.th",company:"บริษัท ไทยเทค จำกัด",group:"ขนส่งสินค้า"},
    a3:{seq:"3",name:"สมชาย มั่นคง",phone:"0861112222",email:"sc@example.com",company:"ธนาคารตัวอย่าง",group:"การเงิน"},
    a4:{seq:"4",name:"Alice Wong",phone:"0823334444",email:"alice@globex.com",company:"Globex Asia",group:"คลังสินค้า"}
  };
  const save = () => { localStorage.setItem(KEY, JSON.stringify(store)); emit(); };
  let emit = () => {};
  DB = {
    sub(cb){ emit = () => cb(Object.entries(store).map(([id,g]) => ({...g,id}))); emit(); },
    update(id,o){ store[id] = {...store[id],...o}; save(); return Promise.resolve(); },
    add(o){ const k = "g"+Date.now()+Math.random().toString(36).slice(2,6); store[k] = o; save(); return Promise.resolve(k); },
    bulk(list){ list.forEach((g,i) => store["i"+Date.now()+i] = g); save(); return Promise.resolve(); },
    reset(kind){ if (kind==="all") store = {}; else Object.keys(store).forEach(id => { if (kind==="walkin") { if (store[id].walkIn) delete store[id]; } else store[id] = {...store[id], checkedIn:false, checkedInAt:null}; }); save(); return Promise.resolve(); }
  };
}

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const full = g => (g.name||"").trim() || "(ไม่ระบุชื่อ)";
const fmt = t => t ? new Date(t).toLocaleString("th-TH",{dateStyle:"short",timeStyle:"medium"}) : "";
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2500); }
const norm = s => String(s||"").toLowerCase().replace(/\s+/g," ").trim();

const A = html => { $("#app").innerHTML = html; };
let view = {name:"dash"};
/* ---- Dashboard ---- */
let tab = "all", sortK = "seq", sortD = 1, filt = "", wOnly = false;
function dash(){
  const base = wOnly ? guests.filter(g => g.walkIn) : guests, nW = guests.filter(g => g.walkIn).length;
  const inn = base.filter(g => g.checkedIn), out = base.filter(g => !g.checkedIn);
  const nIn = guests.filter(g => g.checkedIn).length, pct = guests.length ? Math.round(nIn/guests.length*100) : 0;
  const rows = (tab==="in" ? inn : tab==="out" ? out : base).filter(g => !filt || norm(Object.values(g).join(" ")).includes(norm(filt)))
    .sort((a,b) => { const x=sortK==="checkedIn"?(a.checkedIn?1:0):(a[sortK]??""), y=sortK==="checkedIn"?(b.checkedIn?1:0):(b[sortK]??""); const nx=parseFloat(x), ny=parseFloat(y); return (sortK==="seq"||typeof x==="number" ? (nx||0)-(ny||0) : String(x).localeCompare(String(y),"th")) * sortD; });
  const cols = [["seq","ลำดับ"],["name","ชื่อ-นามสกุล"],["phone","เบอร์โทรศัพท์"],["email","E-mail"],["company","ชื่อบริษัท"],["group","กลุ่มธุรกิจ"]].concat(tab==="all"?[["checkedIn","สถานะ"]]:[]).concat(tab!=="out"?[["checkedInAt","เวลาเช็คอิน"]]:[]);
  A(`<div class="wrap wide">
    <div class="top"><h1 style="margin:0;font-size:26px">Dashboard</h1><div class="row" style="flex:none">
      <button class="btn ghost sm" id="imp">+ เพิ่มรายชื่อ</button><select id="expk" aria-label="ประเภทข้อมูลที่ export" style="width:auto;padding:6px 10px;font-size:15px;min-height:38px"><option value="all">ทั้งหมด (แยก sheet)</option><option value="in">เช็คอินแล้ว</option><option value="out">ยังไม่มา</option><option value="walk">Walk-in เท่านั้น</option></select><button class="btn sm" id="exp">Export Excel</button><button class="btn danger sm" id="rst">Reset ข้อมูล</button></div></div>
    
    <div class="stats"><div class="stat"><span>รวมทั้งหมด</span><b>${guests.length}</b></div><div class="stat"><span>Check in แล้ว</span><b style="color:var(--ok)">${nIn}</b></div><div class="stat"><span>ยังไม่ Check in</span><b>${guests.length-nIn}</b></div><div class="stat" id="wst" style="cursor:pointer"><span>แขก Walk-in</span><b style="color:var(--brand)">${nW}</b></div></div>
    <div class="bar" aria-label="${pct}%"><i style="width:${pct}%"></i></div>
    <div class="row" style="align-items:center;margin-bottom:12px">
      <div class="tabs" role="tablist" style="margin:0;flex:none;flex-wrap:wrap"><button class="tab" role="tab" data-t="all" aria-selected="${tab==="all"}">รายชื่อทั้งหมด (${base.length})</button><button class="tab" role="tab" data-t="in" aria-selected="${tab==="in"}">เช็คอินแล้ว (${inn.length})</button><button class="tab" role="tab" data-t="out" aria-selected="${tab==="out"}">ยังไม่มา (${out.length})</button><button class="tab" id="wo" aria-pressed="${wOnly}">เฉพาะ Walk-in (${nW})</button></div>
      <input id="flt" type="search" placeholder="กรองรายชื่อ" value="${esc(filt)}" style="max-width:280px;padding:9px 14px;font-size:16px">
    </div>
    <div class="tw"><table><thead><tr>${cols.map(([k,l]) => `<th data-k="${k}">${l}${sortK===k?(sortD>0?" ▲":" ▼"):""}</th>`).join("")}<th></th></tr></thead>
    <tbody>${rows.map(g => `<tr>${cols.map(([k]) => `<td>${k==="checkedInAt"?esc(fmt(g[k])):k==="checkedIn"?(g.checkedIn?'<span class="tag ok">เช็คอินแล้ว</span>':'<span class="tag no">ยังไม่มา</span>'):esc(g[k]||"")}</td>`).join("")}<td style="white-space:nowrap"><button class="btn ghost sm" data-ed="${g.id}">แก้ไข</button> ${g.checkedIn?`<button class="btn ghost sm" data-un="${g.id}">ยกเลิกเช็คอิน</button>`:`<button class="btn sm" data-ci="${g.id}">เช็คอินให้</button>`}</td></tr>`).join("") || `<tr><td colspan="10" style="color:var(--mute)">ไม่มีรายการ</td></tr>`}</tbody></table></div>
  </div>`);
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.t; dash(); });
  $("#wst").onclick = () => { wOnly = !wOnly; dash(); };
  $("#wo").onclick = () => { wOnly = !wOnly; dash(); };
  document.querySelectorAll("th[data-k]").forEach(h => h.onclick = () => { sortD = sortK===h.dataset.k ? -sortD : 1; sortK = h.dataset.k; dash(); });
  const f = $("#flt"); f.oninput = () => { filt = f.value; const p = f.selectionStart; dash(); const n=$("#flt"); n.focus(); n.setSelectionRange(p,p); };
  document.querySelectorAll("[data-un]").forEach(b => b.onclick = () => confirm("ยกเลิกการเช็คอินของรายการนี้?") && DB.update(b.dataset.un,{checkedIn:false,checkedInAt:null}));
  document.querySelectorAll("[data-ci]").forEach(b => b.onclick = () => DB.update(b.dataset.ci,{checkedIn:true,checkedInAt:Date.now()}));
  document.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => openEdit(b.dataset.ed));
  $("#exp").onclick = () => exportXlsx($("#expk").value);
  $("#imp").onclick = openAdd;
  $("#rst").onclick = openReset;
}
function exportXlsx(kind="all"){
  const map = g => ({"ลำดับ":g.seq||"","ชื่อ-นามสกุล":g.name||"","เบอร์โทรศัพท์":g.phone||"","E-mail":g.email||"","ชื่อบริษัท":g.company||"","กลุ่มธุรกิจ":g.group||"","สถานะ":g.checkedIn?"เช็คอินแล้ว":"ยังไม่มา","เวลาเช็คอิน":g.checkedInAt?fmt(g.checkedInAt):"","แขกหน้างาน":g.walkIn?"ใช่":""});
  const bySeq = l => [...l].sort((a,b) => (parseFloat(a.seq)||0)-(parseFloat(b.seq)||0));
  const sets = {all:["ทั้งหมด",guests], in:["เช็คอินแล้ว",guests.filter(g=>g.checkedIn)], out:["ยังไม่มา",guests.filter(g=>!g.checkedIn)], walk:["Walk-in",guests.filter(g=>g.walkIn)]};
  const pick = kind==="all" ? ["all","in","out","walk"] : [kind];
  if (!sets[kind==="all"?"all":kind][1].length) return toast("ไม่มีข้อมูลในประเภทนี้");
  const wb = XLSX.utils.book_new();
  pick.forEach(k => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bySeq(sets[k][1]).map(map)), sets[k][0]));
  const tag = {all:"all",in:"checked-in",out:"not-arrived",walk:"walk-in"}[kind];
  XLSX.writeFile(wb, `checkin_${tag}_${new Date().toISOString().slice(0,10)}.xlsx`);
}
const ALIAS = {seq:["ลำดับ","seq","no","no."],name:["ชื่อ-นามสกุล","ชื่อ นามสกุล","name","full name","ชื่อ"],phone:["เบอร์โทรศัพท์","เบอร์โทร","phone","tel","โทรศัพท์"],email:["e-mail","email","อีเมล"],company:["ชื่อบริษัท","บริษัท","company"],group:["กลุ่มธุรกิจ","group","ประเภทธุรกิจ"]};
const ORDER = ["seq","name","phone","email","company","group"];
function parseRows(aoa){
  aoa = aoa.map(r => r.map(c => String(c ?? "").trim())).filter(r => r.some(Boolean));
  let hi = -1, map = {};
  for (let i=0; i<Math.min(aoa.length,10); i++){
    const m = {}; aoa[i].forEach((c,ci) => { const k = c.toLowerCase(); for (const f in ALIAS) if (m[f]===undefined && ALIAS[f].includes(k)) m[f] = ci; });
    if (Object.keys(m).length >= 2){ hi = i; map = m; break; }
  }
  let body = aoa;
  if (hi >= 0) body = aoa.slice(hi+1);
  else {
    const cols = Math.max(0,...aoa.map(r => r.length));
    const order = cols <= 1 ? ["name"] : /^\d+$/.test(aoa[0]?.[0] || "") ? ORDER : ORDER.slice(1);
    order.forEach((f,i) => map[f] = i);
  }
  return body.map(r => { const o = {checkedIn:false}; ORDER.forEach(f => o[f] = map[f]!==undefined ? (r[map[f]]||"") : "");
    if (/^[1-9]\d{8}$/.test(o.phone)) o.phone = "0"+o.phone; return o; }).filter(o => o.name || o.company);
}
const toAoa = wb => XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:"", raw:false});
const GROUPS = ["ขนส่งภายในประเทศ","ผู้จัดการขนส่งสินค้า","ตัวแทนออกของ","สายเรือ / สายการบิน","คลังสินค้า","อื่น ๆ"];
const OTHER = GROUPS.length - 1;
/* ค่าที่เก็บในฐานข้อมูล: ข้อ 1-5 เก็บชื่อกลุ่ม, ข้อ 6 เก็บเป็น "อื่น ๆ: ข้อความที่กรอก" */
const groupValue = (sel, other) => sel === "" || sel == null ? "" : +sel === OTHER ? (other ? "อื่น ๆ: " + other : "") : GROUPS[+sel];
function parseGroup(v){
  v = (v || "").trim(); if (!v) return {sel:"", other:"", legacy:false};
  const i = GROUPS.indexOf(v); if (i >= 0 && i !== OTHER) return {sel:i, other:"", legacy:false};
  const m = v.match(/^อื่น ๆ\s*:?\s*(.*)$/); if (m) return {sel:OTHER, other:m[1].trim(), legacy:false};
  return {sel:OTHER, other:v, legacy:true};   /* ข้อความเดิมที่นำเข้าจาก Excel */
}
function openEdit(id){
  const g = guests.find(x => x.id === id); if (!g) return;
  const m = $("#modal"), F = [["name","ชื่อ-นามสกุล"],["phone","เบอร์โทรศัพท์"],["email","E-mail"],["company","ชื่อบริษัท"]], pg = parseGroup(g.group);
  m.hidden = false;
  m.innerHTML = `<div class="ov"><div class="dlg" role="dialog" aria-modal="true" aria-label="แก้ไขข้อมูลแขก" style="max-width:520px">
    <div class="top"><h2 style="margin:0">แก้ไขข้อมูลแขก${g.seq?` (ลำดับ ${esc(g.seq)})`:""}</h2><button class="btn ghost sm" id="mx">ปิด</button></div>
    ${F.map(([k,l]) => `<label for="e_${k}">${l}</label><input id="e_${k}" value="${esc(g[k]||"")}" autocomplete="off" ${k==="phone"?'type="tel" inputmode="tel"':k==="email"?'type="email" inputmode="email"':""}>`).join("")}
    <label for="e_gsel">กลุ่มธุรกิจ</label><select id="e_gsel"><option value="">— ไม่ระบุ —</option>${GROUPS.map((x,i) => `<option value="${i}" ${pg.sel===i?"selected":""}>${i+1}. ${x}</option>`).join("")}</select>
    <input id="e_gother" placeholder="โปรดระบุกลุ่มธุรกิจ" value="${esc(pg.other)}" autocomplete="off" ${pg.sel===OTHER?"":"hidden"} style="margin-top:6px">
    <div class="row" style="margin-top:20px"><button class="btn ghost" id="ec">ยกเลิก</button><button class="btn" id="es">บันทึก</button></div></div></div>`;
  const close = () => { m.hidden = true; m.innerHTML = ""; document.removeEventListener("keydown", esc2); };
  const esc2 = e => e.key === "Escape" && close();
  document.addEventListener("keydown", esc2);
  m.querySelector(".ov").onclick = e => e.target.classList.contains("ov") && close();
  $("#mx").onclick = $("#ec").onclick = close;
  $("#es").onclick = async () => {
    const o = {}; F.forEach(([k]) => o[k] = $("#e_"+k).value.trim());
    const gsel = $("#e_gsel").value, gother = $("#e_gother").value.trim();
    if (gsel !== "" && +gsel === OTHER && !gother) return toast("กรุณาระบุกลุ่มธุรกิจ (อื่น ๆ)");
    o.group = pg.legacy && +gsel === OTHER && gother === pg.other ? g.group : groupValue(gsel, gother);
    if (!o.name && !o.company) return toast("กรุณากรอกชื่อ-นามสกุลหรือชื่อบริษัท");
    try { await DB.update(id, o); toast("บันทึกการแก้ไขแล้ว"); close(); } catch(e){ console.error(e); toast("บันทึกไม่สำเร็จ"); }
  };
  $("#e_gsel").onchange = () => { const o = $("#e_gother"); o.hidden = $("#e_gsel").value === "" || +$("#e_gsel").value !== OTHER; if (!o.hidden) o.focus(); };
  $("#e_name").focus();
}
function openReset(){
  const m = $("#modal"); m.hidden = false;
  const close = () => { m.hidden = true; m.innerHTML = ""; document.removeEventListener("keydown", esc2); };
  const esc2 = e => e.key === "Escape" && close();
  document.addEventListener("keydown", esc2);
  const opts = {
    checkin:["ล้างสถานะ Check in ทั้งหมด","คงรายชื่อไว้ทั้งหมด (รวมแขก walk-in) แต่ทุกคนกลับเป็น ยังไม่ Check in เหมาะกับการซ้อมก่อนวันงาน"],
    walkin:["ลบเฉพาะแขก Walk-in","รายชื่อที่นำเข้าไว้ยังอยู่ครบ"],
    all:["ลบรายชื่อทั้งหมด","เริ่มระบบใหม่ ต้องนำเข้ารายชื่อใหม่ทั้งหมด"]
  };
  const count = k => k==="walkin" ? guests.filter(g => g.walkIn).length : guests.length;
  const shell = body => { m.innerHTML = `<div class="ov"><div class="dlg" role="dialog" aria-modal="true" aria-label="Reset ข้อมูล" style="max-width:520px"><div class="top"><h2 style="margin:0">Reset ข้อมูล</h2><button class="btn ghost sm" id="mx">ปิด</button></div>${body}</div></div>`;
    m.querySelector(".ov").onclick = e => e.target.classList.contains("ov") && close(); $("#mx").onclick = close; };
  const step1 = () => {
    shell(`<p class="hint">เลือกสิ่งที่ต้องการ Reset (ยังไม่มีการลบจนกว่าจะยืนยันในขั้นตอนถัดไป)</p>
      ${Object.entries(opts).map(([k,[t,d]],i) => `<label style="display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:17px;margin:12px 0"><input type="radio" name="rk" value="${k}" ${i===0?"checked":""} style="width:auto;margin-top:6px"><span><b>${t}</b><br><small style="color:var(--mute)">${d}</small></span></label>`).join("")}
      <p class="hint">แนะนำให้ Export Excel สำรองข้อมูลก่อน <button class="link" id="bk">Export ทั้งหมดตอนนี้</button></p>
      <div class="row" style="margin-top:16px"><button class="btn ghost" id="c1">ยกเลิก</button><button class="btn" id="n1">ถัดไป</button></div>`);
    $("#c1").onclick = close; $("#bk").onclick = () => exportXlsx("all");
    $("#n1").onclick = () => step2(m.querySelector("input[name=rk]:checked").value);
  };
  const step2 = k => {
    const n = count(k);
    shell(`<div class="warn"><b>${opts[k][0]}</b><br>มีผลกับ ${n} รายการ และไม่สามารถกู้คืนได้</div>
      <label for="cf">พิมพ์คำว่า <b>RESET</b> เพื่อยืนยัน</label><input id="cf" autocomplete="off" placeholder="RESET">
      <div class="row" style="margin-top:20px"><button class="btn ghost" id="b2">ย้อนกลับ</button><button class="btn" id="ok" disabled style="background:var(--red)">ยืนยัน Reset</button></div>`);
    const cf = $("#cf"), ok = $("#ok"); cf.focus();
    cf.oninput = () => { ok.disabled = cf.value.trim() !== "RESET"; };
    $("#b2").onclick = step1;
    ok.onclick = async () => { ok.disabled = true;
      try { await DB.reset(k); toast("Reset ข้อมูลเรียบร้อย"); close(); } catch(e){ console.error(e); toast("Reset ไม่สำเร็จ"); ok.disabled = false; } };
  };
  step1();
}
function openAdd(){
  const m = $("#modal"); m.hidden = false; let mode = "file", pending = [], skip = true;
  m.innerHTML = `<div class="ov"><div class="dlg" role="dialog" aria-modal="true" aria-label="เพิ่มรายชื่อ">
    <div class="top"><h2 style="margin:0">เพิ่มรายชื่อ</h2><button class="btn ghost sm" id="mx">ปิด</button></div>
    <div class="tabs"><button class="tab" data-m="file" aria-selected="true">อัปโหลดไฟล์ Excel / CSV</button><button class="tab" data-m="paste" aria-selected="false">วางรายชื่อ (Paste)</button></div>
    <div id="pf"><div class="drop" id="dz"><label class="btn" for="file" id="pick" tabindex="0" role="button">เลือกไฟล์ Excel / CSV</label><input type="file" id="file" class="sr" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"><p class="hint" id="fn" style="margin:10px 0 0">หรือลากไฟล์มาวางที่นี่</p></div><p class="hint">หัวคอลัมน์ตามเอกสารลงทะเบียน: ลำดับ, ชื่อ-นามสกุล, เบอร์โทรศัพท์, E-mail, ชื่อบริษัท, กลุ่มธุรกิจ (ไฟล์ CSV ควรบันทึกเป็น UTF-8)</p></div>
    <div id="pp" hidden><textarea id="ta" rows="8" placeholder="คัดลอกรายชื่อจาก Excel มาวางที่นี่ 1 คนต่อ 1 บรรทัด&#10;ลำดับ, ชื่อ-นามสกุล, เบอร์โทรศัพท์, E-mail, ชื่อบริษัท, กลุ่มธุรกิจ"></textarea>
      <p class="hint">รองรับข้อมูลที่คัดลอกจาก Excel (คั่นด้วย Tab) หรือคั่นด้วยจุลภาค จะมีแถวหัวคอลัมน์หรือไม่ก็ได้ ถ้าวางแค่ชื่ออย่างเดียวก็ได้</p></div>
    <div id="pv"></div></div></div>`;
  const close = () => { m.hidden = true; m.innerHTML = ""; document.removeEventListener("keydown", esc2); };
  const esc2 = e => e.key === "Escape" && close();
  document.addEventListener("keydown", esc2);
  m.querySelector(".ov").onclick = e => e.target.classList.contains("ov") && close();
  $("#mx").onclick = close;
  m.querySelectorAll(".tab").forEach(b => b.onclick = () => { mode = b.dataset.m; m.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t===b)); $("#pf").hidden = mode!=="file"; $("#pp").hidden = mode!=="paste"; });
  const key = g => norm(g.name)+"|"+norm(g.company);
  function pv(){
    const box = $("#pv"); if (!pending.length){ box.innerHTML = ""; return; }
    const have = new Set(guests.map(key)), seen = new Set();
    const dup = pending.map(g => { const k = key(g), d = have.has(k) || seen.has(k); seen.add(k); return d; });
    const nd = dup.filter(Boolean).length, n = skip ? pending.length-nd : pending.length;
    box.innerHTML = `<p style="margin:14px 0 6px"><b>พบ ${pending.length} รายชื่อ</b>${nd?` <span class="tag no">ซ้ำกับที่มีอยู่/ในชุดนี้ ${nd}</span>`:""}</p>
      ${nd?`<label style="display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--ink)"><input type="checkbox" id="sk" ${skip?"checked":""} style="width:auto"> ข้ามรายชื่อที่ซ้ำ (ชื่อและบริษัทเหมือนกัน)</label>`:""}
      <div class="tw" style="margin:8px 0 14px"><table><thead><tr><th>ลำดับ</th><th>ชื่อ-นามสกุล</th><th>เบอร์โทรศัพท์</th><th>E-mail</th><th>ชื่อบริษัท</th><th>กลุ่มธุรกิจ</th></tr></thead><tbody>
      ${pending.slice(0,5).map(g => `<tr>${ORDER.map(f => `<td>${esc(g[f])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      ${pending.length>5?`<p class="hint">แสดง 5 รายการแรกจากทั้งหมด ${pending.length}</p>`:""}
      <button class="btn block" id="go" ${n?"":"disabled"}>นำเข้า ${n} รายชื่อ</button>`;
    const sk = $("#sk"); if (sk) sk.onchange = () => { skip = sk.checked; pv(); };
    $("#go").onclick = async () => {
      let mx = Math.max(0,...guests.map(x => parseInt(x.seq)||0));
      const items = pending.filter((g,i) => !(skip && dup[i])).map(g => ({...g, seq: g.seq || String(++mx)}));
      try { await DB.bulk(items); toast(`นำเข้า ${items.length} รายชื่อแล้ว`); close(); } catch(e){ console.error(e); toast("นำเข้าไม่สำเร็จ"); }
    };
  }
  const set = list => { pending = list; if (!list.length && ($("#ta").value.trim() || $("#file").value)) $("#pv").innerHTML = `<p class="hint">ไม่พบรายชื่อที่นำเข้าได้ ตรวจสอบหัวคอลัมน์หรือรูปแบบข้อมูล</p>`; else pv(); };
  const handle = f => {
    if (!f) return;
    const box = $("#pv"), bad = t => box.innerHTML = `<p class="hint" style="color:var(--red)">${t}</p>`;
    $("#fn").textContent = f.name; pending = []; box.innerHTML = `<p class="hint">กำลังอ่านไฟล์ ${esc(f.name)} ...</p>`;
    if (typeof XLSX === "undefined") return bad("โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ตแล้วโหลดหน้าใหม่) หรือใช้แท็บ วางรายชื่อ แทน");
    const r = new FileReader(), csv = /\.csv$/i.test(f.name);
    r.onerror = () => bad("อ่านไฟล์ไม่ได้ กรุณาลองเลือกไฟล์ใหม่");
    r.onload = ev => {
      try {
        const wb = csv ? XLSX.read(ev.target.result,{type:"string",raw:true}) : XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        pending = parseRows(toAoa(wb));
        if (!pending.length) bad("ไม่พบรายชื่อที่นำเข้าได้ ตรวจสอบว่าไฟล์มีหัวคอลัมน์ เช่น ชื่อ-นามสกุล, ชื่อบริษัท"); else pv();
      } catch(err){ console.error(err); bad("อ่านไฟล์ไม่ได้: "+esc(err.message)); }
    };
    csv ? r.readAsText(f,"utf-8") : r.readAsArrayBuffer(f);
  };
  $("#file").onchange = e => { handle(e.target.files[0]); e.target.value = ""; };
  $("#pick").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#file").click(); } };
  const dz = $("#dz");
  ["dragenter","dragover"].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.add("over"); }));
  ["dragleave","drop"].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.remove("over"); }));
  dz.addEventListener("drop", e => handle(e.dataTransfer.files[0]));
  let tm; $("#ta").oninput = () => { clearTimeout(tm); tm = setTimeout(() => { const t = $("#ta").value.trim(); if (!t) return set([]); try { set(parseRows(toAoa(XLSX.read(t,{type:"string",raw:true})))); } catch(err){ toast("อ่านข้อมูลไม่ได้"); } }, 300); };
}


/* ไม่มีระบบล็อกอิน: เปิดหน้าได้ทันที */
function requireStaff(start){ return start(); }
requireStaff(() => DB.sub(list => { guests = list; dash(); }));
</script>
