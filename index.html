   /lookup/{SHA-256(เบอร์)}/{guestId} = true  — อ่านได้เฉพาะ "ราย key" (ต้องรู้เบอร์ตัวเองถึงจะเจอ) ลิสต์ทั้งหมดไม่ได้
   LOOKUP_SALT ต้องเหมือนกันทุกไฟล์ (checkin / register / admin) */
const LOOKUP_SALT = "lg2027-lookup";
const normPhone = p => { let d = String(p || "").replace(/\D/g, ""); if (/^66\d{9}$/.test(d)) d = "0" + d.slice(2); else if (/^[1-9]\d{8}$/.test(d)) d = "0" + d; return d; };
async function phoneKey(p){
  if (!(window.crypto && crypto.subtle)) throw new Error("ต้องเปิดผ่าน https");
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(LOOKUP_SALT + "|" + normPhone(p)));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
const useFB = !!(firebaseConfig.apiKey && firebaseConfig.databaseURL);
if (useFB) {
  firebase.initializeApp(firebaseConfig);

    /* ค้นหาจากเบอร์โทร: อ่าน /lookup/{hash} ได้ id แล้วอ่าน /guests/{id} ทีละราย (ไม่มีการโหลดรายชื่อทั้งหมด) */
    async lookup(phone){
      const k = await phoneKey(phone), ids = Object.keys((await db.ref("lookup/" + k).once("value")).val() || {}), out = [];

/* ---- Search: ค้นหาด้วยเบอร์โทรศัพท์ (ค้นให้อัตโนมัติตั้งแต่ 9 หลัก — ข้อความ "ไม่พบ" จะแสดงเมื่อพิมพ์ครบ 10 หลัก หรือกด Enter/ปุ่มค้นหา) ---- */

  const inp = $("#q"), res = $("#res"); inp.focus(); inp.setSelectionRange(q.length, q.length);
  let hits = [], t;
  const run = async (explicit = true) => {
    clearTimeout(t); view.q = inp.value; const d = normPhone(inp.value), my = ++reqId;
    if (!d) { res.innerHTML = ""; hits = []; return; }
    if (d.length < 9) { res.innerHTML = msgHtml("กรุณาพิมพ์เบอร์โทรศัพท์ให้ครบ"); hits = []; return; }
    res.innerHTML = msgHtml("กำลังค้นหา...");
    let found;
    try { found = await DB.lookup(d); } catch(e){ console.error(e); if (my === reqId) res.innerHTML = msgHtml("ค้นหาไม่สำเร็จ กรุณาลองอีกครั้ง หรือติดต่อเจ้าหน้าที่ลงทะเบียน"); return; }
    if (my !== reqId) return;
    hits = found;
    res.innerHTML = hits.length
      ? `<div class="list" role="listbox">${hits.map((g,i) => `<button class="item" role="option" data-i="${i}"><span><b>${esc(full(g))}</b><small>${esc(g.company||"-")}</small></span>${g.checkedIn?'<span class="tag ok">เช็คอินแล้ว</span>':""}</button>`).join("")}</div>`
      : (explicit === true || d.length >= 10) ? msgHtml("ไม่พบเบอร์นี้ในรายชื่อ กรุณาตรวจสอบเบอร์โทรศัพท์ หรือติดต่อเจ้าหน้าที่ลงทะเบียน") : "";
    res.querySelectorAll(".item").forEach(b => b.onclick = () => go("confirm", {g:hits[+b.dataset.i]}));
  };
  inp.oninput = () => { view.q = inp.value; clearTimeout(t); ++reqId; hits = []; const d = normPhone(inp.value); if (d.length >= 9) t = setTimeout(() => run(false), 250); else res.innerHTML = ""; };
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); if (hits.length === 1) go("confirm", {g:hits[0]}); else run(); } };
  $("#go").onclick = () => run(true);
  if (q) run();
}

/* ---- Confirm ---- */
function confirmV(){
  const g = view.g; if (!g) return go("search", {q:""});
  A(`<div class="wrap"><h2>ยืนยันข้อมูล</h2><div class="card">
    ${g.checkedIn ? `<div class="warn">คุณเช็คอินไปแล้วเมื่อ ${esc(fmt(g.checkedInAt))}</div>` : ""}
    <dl><dt>ชื่อ-นามสกุล</dt><dd>${esc(g.name)}</dd><dt>ชื่อบริษัท</dt><dd>${esc(g.company||"-")}</dd></dl>
    <button class="btn block" id="ci">Check in</button>
    <button class="btn danger block" id="cn" style="margin-top:10px">Cancel</button>
  </div></div>`);
  $("#ci").onclick = () => checkIn(g);
  $("#cn").onclick = () => go("search", {q:""});
}
async function checkIn(g){
  if (g.checkedIn) return go("welcome", {g});   /* เช็คอินแล้ว ไม่เขียนซ้ำ */
  const upd = {checkedIn:true, checkedInAt:Date.now()};
  $("#ci").disabled = true;
  try { await DB.update(g.id, upd); go("welcome", {g:{...g,...upd}}); }
  catch(e){ console.error(e); $("#ci").disabled = false; toast("บันทึกไม่สำเร็จ กรุณาลองอีกครั้ง หรือติดต่อเจ้าหน้าที่"); }
}

/* ---- Welcome (กลับหน้าค้นหาเองใน 7 วินาที) ---- */
function welcome(){
  const g = view.g;
  A(`<div class="welcome"><div class="tick" aria-hidden="true">✓</div>
    <h1>ยินดีต้อนรับ คุณ${esc(full(g))}</h1>
    ${g.company ? `<p>${/^(บริษัท|บจก|บมจ|หจก|ห้างหุ้นส่วน|ธนาคาร)/.test(g.company)?"":"บริษัท "}${esc(g.company)}</p>` : "<p></p>"}
    <button class="btn" id="dn">เสร็จสิ้น</button></div>`);
  $("#dn").onclick = () => go("search", {q:""});
  wTimer = setTimeout(() => go("search", {q:""}), 7000);
}

render();
</script>
