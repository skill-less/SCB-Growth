<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Station 1: Check-in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 bg-cover bg-center bg-fixed" style="background-image: url('bg.png');">
  <!-- เอา bg-white และ backdrop-blur ออกเพื่อให้ใสทะลุไปถึง bg.png -->
  <div id="app" class="max-w-md mx-auto min-h-screen relative flex flex-col">
    
    <!-- ขยับ banner ลงมา โดยใช้ mt-12 (Margin Top) -->
    <img src="banner.png" alt="Banner" class="w-full h-auto shrink-0 object-cover mt-12">
    
    <!-- หน้า Landing Page -->
    <div id="view-landing" class="flex-1 flex flex-col items-center pt-12 p-6 text-center">
      <h1 class="text-3xl font-bold text-white mb-2 tracking-wide">LOGISTICS GROWTH<br>2027</h1>
      <p class="text-white/80 font-medium mb-8 text-sm">จุดเช็คอินสำหรับผู้มีรายชื่อล่วงหน้า</p>
      
      <button onclick="enterSearch()" class="w-full bg-[#4e2a84] hover:bg-[#3a1f64] text-white text-xl py-4 rounded-xl shadow-lg font-bold active:scale-95 transition-all">
        Enter
      </button>
    </div>

    <!-- หน้าค้นหา -->
    <div id="view-search" class="flex-1 flex flex-col pt-8 p-6" style="display: none;">
      <!-- เปลี่ยนตัวหนังสือเป็นสีขาว และเอาปุ่ม 'กลับ' ออก -->
      <h2 class="text-2xl font-bold text-white mb-6">ค้นหารายชื่อ</h2>
      
      <div class="flex gap-2 mb-6">
        <input type="text" id="searchInput" placeholder="พิมพ์ชื่อ-นามสกุล..." class="flex-1 p-4 border border-gray-300 rounded-xl text-lg focus:border-[#4e2a84] outline-none shadow-sm">
        <button onclick="doSearch()" class="bg-[#4e2a84] text-white px-6 rounded-xl font-bold shadow-md hover:bg-[#3a1f64]">ค้นหา</button>
      </div>
      
      <div id="searchResults" class="flex-1 overflow-y-auto"></div>
    </div>

    <!-- หน้าต่างยืนยัน -->
    <!-- ขยับฟอร์มขึ้น โดยเปลี่ยน justify-center เป็น pt-12 -->
    <div id="view-confirm" class="flex-1 flex flex-col justify-start pt-12 p-6" style="display: none;">
      <div id="confirm-box">
        <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100 text-center mb-8">
          <h2 class="text-gray-800 font-bold mb-2 text-sm">ยืนยันข้อมูลการเช็คอิน</h2>
          <p id="c-name" class="text-2xl font-bold mb-1 text-gray-900">-</p>
          <p id="c-company" class="text-lg text-gray-600">-</p>
        </div>
        <div class="space-y-4">
          <button id="btn-checkin" class="w-full p-4 bg-[#4e2a84] hover:bg-[#3a1f64] text-white rounded-xl text-xl font-bold shadow-md transition-colors">Check in</button>
          <button onclick="closeConfirm()" class="w-full p-4 bg-white border border-gray-300 hover:bg-gray-50 text-gray-800 rounded-xl text-xl font-bold shadow-sm transition-colors">ยกเลิก</button>
        </div>
      </div>
    </div>

    <!-- หน้าสำเร็จ -->
    <div id="view-success" class="flex-1 flex flex-col items-center justify-start pt-12 p-6" style="display: none;">
      <div class="bg-white/95 p-8 rounded-2xl shadow-lg flex flex-col items-center w-full backdrop-blur-sm">
        <div class="w-20 h-20 bg-[#4e2a84] rounded-full flex items-center justify-center mb-6 shadow-md">
          <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h1 class="text-3xl font-bold text-[#4e2a84] mb-4">ยินดีต้อนรับ</h1>
        <p id="s-name" class="text-2xl font-bold mb-2 text-gray-800">-</p>
        <p id="s-company" class="text-xl text-gray-600">-</p>
        <button onclick="resetToLanding()" class="mt-8 p-4 bg-[#4e2a84] hover:bg-[#3a1f64] text-white rounded-xl px-10 w-full font-bold shadow-md transition-colors">เสร็จสิ้น (กลับหน้าแรก)</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, getDocs, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    let allAttendees = [];
    let currentGuest = null;

    async function loadData() {
      const snapshot = await getDocs(collection(db, "attendees"));
      allAttendees = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    loadData();

    window.enterSearch = () => {
      document.getElementById('view-landing').style.display = 'none';
      document.getElementById('view-search').style.display = 'flex';
      document.getElementById('searchInput').focus();
    };

    window.backToLanding = () => {
      document.getElementById('view-search').style.display = 'none';
      document.getElementById('view-landing').style.display = 'flex';
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').innerHTML = '';
    };

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') doSearch();
    });

    window.doSearch = () => {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      const resultsDiv = document.getElementById('searchResults');
      if (!keyword) { resultsDiv.innerHTML = '<p class="text-center text-white mt-4 bg-black/40 p-3 rounded-lg font-bold">กรุณาพิมพ์ชื่อเพื่อค้นหา</p>'; return; }

      const filtered = allAttendees.filter(g => 
        g.fullName && g.fullName.toLowerCase().includes(keyword)
      );

      if(filtered.length === 0) {
        resultsDiv.innerHTML = '<p class="text-center text-white mt-4 bg-black/40 p-3 rounded-lg font-bold">ไม่พบรายชื่อ</p>';
        return;
      }

      resultsDiv.innerHTML = filtered.map(g => `
        <div onclick="selectGuest('${g.id}')" class="p-4 mb-3 bg-white border ${g.status === 'checked_in' ? 'border-[#4e2a84] bg-purple-50' : 'border-gray-200'} rounded-xl shadow-sm cursor-pointer hover:border-[#4e2a84] transition-all">
          <div class="flex justify-between items-center">
             <div>
                <p class="font-bold text-lg text-gray-800">${g.fullName || '-'}</p>
                <p class="text-gray-500 text-sm mt-1">${g.company || '-'}</p>
             </div>
             ${g.status === 'checked_in' ? '<span class="bg-[#4e2a84]/10 text-[#4e2a84] px-3 py-1 rounded-full text-sm font-bold shadow-sm">✅ เช็คอินแล้ว</span>' : ''}
          </div>
        </div>
      `).join('');
    };

    window.selectGuest = async (id) => {
      const docRef = doc(db, "attendees", id);
      const snap = await getDoc(docRef);
      if(snap.exists()) {
        currentGuest = { id: snap.id, ...snap.data() };
        document.getElementById('c-name').innerText = currentGuest.fullName;
        document.getElementById('c-company').innerText = currentGuest.company || '-';
        document.getElementById('view-search').style.display = 'none';
        document.getElementById('view-confirm').style.display = 'flex';
      }
    };

    window.closeConfirm = () => {
      document.getElementById('view-confirm').style.display = 'none';
      document.getElementById('view-search').style.display = 'flex';
    };

    document.getElementById('btn-checkin').addEventListener('click', async () => {
      document.getElementById('s-name').innerText = currentGuest.fullName;
      document.getElementById('s-company').innerText = currentGuest.company || '-';
      document.getElementById('view-confirm').style.display = 'none';
      document.getElementById('view-success').style.display = 'flex';
      
      await updateDoc(doc(db, "attendees", currentGuest.id), {
        status: 'checked_in',
        checkInTime: serverTimestamp()
      });
      loadData(); 
    });

    window.resetToLanding = () => {
      document.getElementById('view-success').style.display = 'none';
      document.getElementById('view-landing').style.display = 'flex';
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').innerHTML = '';
    };
  </script>
</body>
</html>
